[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-service-agents"
version = "0.1.0"
description = "Enterprise multi-agent AI platform for proforma invoice extraction, validation, and risk assessment"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ofge Hagelana", email = "ofgehagelana2019@gmail.com" }]
requires-python = ">=3.10,<3.14"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
dependencies = [
    "crewai>=1.15,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "pdf2image>=1.17",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trade_service_agents = ["agents/config/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B008", # FastAPI's Depends()/File() are intentionally called in argument defaults
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
