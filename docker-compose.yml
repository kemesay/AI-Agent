services:
  api:
    build: .
    image: trade-service-agents:latest
    container_name: trade-service-agents
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8050}:8000"
    env_file:
      - .env
    # The customs indicative-price reference workbook ships inside the image (see
    # core/config.py's default), so no volume mount is needed out of the box. To use an
    # updated/replacement price list without rebuilding, set CUSTOMS_PRICE_LIST_PATH in .env
    # to a container-internal path and uncomment a matching bind mount here.
