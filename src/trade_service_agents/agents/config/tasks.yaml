risk_aggregation_task:
  description: >
    You have been given six independent category risk assessments as
    context, each a JSON object with `score` and `findings`. Build a
    single JSON object mapping category name to its integer score, using
    exactly these keys: invoiceIntegrity, currencyAndPaymentTerms,
    supplierLegitimacy, bankDetails, productAndHsCode,
    logisticsAndIncoterms, purposeMatch. The `bankDetails` category is
    not assessed by any agent in this pipeline — always set it to 0.
    Then call the Aggregate Risk Score tool with that JSON object
    (as a JSON string) as input, and return its output unchanged.
  expected_output: >
    A JSON object with `finalRiskScore`, `riskCategory`, `decision`, and
    `categoryBreakdown`.
  agent: risk_aggregation_agent

executive_summary_task:
  description: >
    Using the final risk aggregation result as context, write a clear,
    professional 2-3 sentence executive summary for a senior
    decision-maker. State the overall risk level and decision
    recommendation, and highlight the most critical concern if any.
    Return only the summary text, with no formatting or markdown.
  expected_output: >
    A 2-3 sentence plain-text executive summary.
  agent: executive_summary_agent
