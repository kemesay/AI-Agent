risk_aggregation_task:
  description: >
    The six risk-dimension category scores have already been computed
    deterministically (agents 4-9 run as plain Python, not as LLM calls,
    to keep this pipeline cheap and fast). Category scores (JSON): {category_scores_json}

    Call the Aggregate Risk Score tool with this exact JSON string as
    input.

    You must NOT compute weights, weighted scores, or a final score
    yourself — the tool does all of that math. Your final answer must be
    EXACTLY the tool's raw JSON output, character for character, with no
    added fields, no restructuring of `categoryBreakdown` into nested
    objects, and no extra commentary before or after the JSON.
  expected_output: >
    The Aggregate Risk Score tool's raw JSON output, unchanged: an object
    with `finalRiskScore` (number), `riskCategory` (one of "Very Low",
    "Low-Medium", "Medium-High", "High", "Critical"), `decision` (string),
    and `categoryBreakdown` (an object mapping each category name to a
    plain integer score, not a nested object).
  agent: risk_aggregation_agent

executive_summary_task:
  description: >
    Using the final risk aggregation result as context, and considering
    these specific findings from the category-level analysis:
    {recommendations_text}

    Write a clear, professional 2-3 sentence executive summary for a
    senior decision-maker. State the overall risk level and decision
    recommendation, and highlight the most critical concern if any.
    Return only the summary text, with no formatting or markdown.
  expected_output: >
    A 2-3 sentence plain-text executive summary.
  agent: executive_summary_agent
