invoice_integrity_task:
  description: >
    Proforma invoice data (JSON): {invoice_json}

    Use the Score Invoice Integrity tool with this exact JSON string as
    input to compute the integrity risk score and findings.
  expected_output: >
    A JSON object with `score` (integer 0-100) and `findings` (a list of
    short strings explaining the score).
  agent: invoice_integrity_agent

